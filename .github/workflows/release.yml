name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    strategy:
      fail-fast: false
      matrix:
        # GitHub no longer hosts any Intel mac runners (macos-13 retired) and
        # macos-14 is retired too. macos-15 is arm64; the x86_64 dmg is
        # cross-compiled on it, which tauri/cargo handle natively.
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Override version from tag or input
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple signing/notarizing credentials set: artifacts ship unsigned.
          # Users must clear the quarantine attribute on first install - see README.
        with:
          tagName: v__VERSION__
          releaseName: "mydirstats v__VERSION__"
          releaseBody: |
            macOS disk usage analyzer - see [README](https://github.com/${{ github.repository }}#install) for install instructions.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
